[agent]
name = "Local AI Agent"
mission = "Execute approved local tasks with evidence-based, policy-enforced tool use."

[ollama]
base_url = "http://localhost:11434"
model = "qwen3:8b"
embedding_model = "nomic-embed-text"
model_context_tokens = 32768
request_timeout_seconds = 120

[prompt]
path = "config/system_prompt.md"

[worker]
lease_seconds = 300
heartbeat_seconds = 30

[dispatch]
enabled = false
max_workers = 1
claim_poll_seconds = 1.0
claim_jitter_seconds = 0.25
worker_stale_seconds = 120
recovery_sweep_seconds = 30
max_dispatch_attempts = 1
heartbeat_event_sample_seconds = 30

[delegation]
max_units = 5
max_unit_tool_calls = 3
max_unit_model_turns = 3
max_retries = 0

[retrieval_benchmark]
top_k = 3
min_precision_at_k = 0.90
min_recall_at_k = 0.90
max_mean_latency_ms = 250.0
max_peak_memory_bytes = 10000000

[workspace]
root = "./workspace"
project_directory = "project"
backups_directory = "backups"
internal_directory = ".agent"
runs_directory = "runs"
logs_directory = "logs"
system_directory = "system"

[limits]
default_max_tool_calls = 30
default_max_runtime_seconds = 600
default_max_shell_executions = 10
default_max_retries = 3

[context]
reserve_tokens = 500
recent_tool_results = 3
recent_conversation_messages = 5
rag_chunk_tokens = 512
rag_chunk_overlap_tokens = 50
rag_top_k = 5
chars_per_token = 4

[sandbox]
docker_binary = "docker"
image = "local-ai-agent-sandbox:latest"
network = "none"
memory = "256m"
cpus = 0.5
pids_limit = 64
user = "10001:10001"
tmpfs_size = "16m"
read_only_root = true

[filesystem]
max_read_bytes = 65536
max_list_entries = 1000

[tool_policy]
workspace_only = true
shell_allowlist = ["python", "python3", "pytest", "pip", "git", "npm", "node", "npx", "ls", "cat", "echo", "grep", "find"]
